  id: ID!
  isActive: Boolean!
  latitude: Float!
  longitude: Float!
  owner: String
  phoneNumber: String!
  triggerType: String
  updatedAt: AWSDateTime
}

type SOSSessionConnection @aws_api_key @aws_cognito_user_pools {
  items: [SOSSession]
