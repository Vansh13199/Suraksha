}

type Subscription {
  onCreateSOSSession: SOSSession @aws_api_key @aws_cognito_user_pools @aws_subscribe(mutations : ["createSOSSession"])
  onDeleteSOSSession: SOSSession @aws_api_key @aws_cognito_user_pools @aws_subscribe(mutations : ["deleteSOSSession"])
  onUpdateSOSSession: SOSSession @aws_api_key @aws_cognito_user_pools @aws_subscribe(mutations : ["updateSOSSession"])
}

