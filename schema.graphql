type EmergencyContact @aws_cognito_user_pools {
  createdAt: AWSDateTime
  id: ID!
  name: String!
  owner: String
  phoneNumber: String!
  relationship: String
  updatedAt: AWSDateTime
  userId: ID!
}

type EmergencyContactConnection {
  items: [EmergencyContact]
  nextToken: String
}

type Mutation {
  createEmergencyContact(input: CreateEmergencyContactInput!): EmergencyContact
  createSOSSession(input: CreateSOSSessionInput!): SOSSession @aws_api_key @aws_cognito_user_pools
  createUser(input: CreateUserInput!): User
  deleteEmergencyContact(input: DeleteEmergencyContactInput!): EmergencyContact
  deleteSOSSession(input: DeleteSOSSessionInput!): SOSSession @aws_api_key @aws_cognito_user_pools
  deleteUser(input: DeleteUserInput!): User
  updateEmergencyContact(input: UpdateEmergencyContactInput!): EmergencyContact
  updateSOSSession(input: UpdateSOSSessionInput!): SOSSession @aws_api_key @aws_cognito_user_pools
  updateUser(input: UpdateUserInput!): User
}

type Query {
  getEmergencyContact(id: ID!): EmergencyContact
  getSOSSession(id: ID!): SOSSession @aws_api_key @aws_cognito_user_pools
  getUser(id: ID!): User
  listEmergencyContacts(filter: TableEmergencyContactFilterInput, limit: Int, nextToken: String): EmergencyContactConnection
  listSOSSessions(filter: TableSOSSessionFilterInput, limit: Int, nextToken: String): SOSSessionConnection @aws_api_key @aws_cognito_user_pools
  listUsers(filter: TableUserFilterInput, limit: Int, nextToken: String): UserConnection
  userByEmail(email: String!): UserConnection
  userByPhoneNumber(phoneNumber: String!): UserConnection
}

type SOSSession @aws_api_key @aws_cognito_user_pools {
  authorizedViewers: [String]
