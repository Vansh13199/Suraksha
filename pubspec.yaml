name: suraksha_plus
description: A production-grade safety application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  provider: ^6.1.1

  # AWS Amplify
  amplify_flutter: ^1.6.0
  amplify_auth_cognito: ^1.6.0
  amplify_api: ^1.6.0
  
  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  location: ^5.0.3

  # Bluetooth
  flutter_blue_plus: ^1.20.0
  permission_handler: ^11.1.0

  # Phone / External Intents
  url_launcher: ^6.2.5
  flutter_phone_direct_caller: ^2.1.1

  # UI/UX
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0

  # Utils
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  intl: ^0.19.0
  http: ^1.2.0
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^20.1.0
  flutter_ble_peripheral: ^2.1.0
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.3
  battery_plus: ^6.0.1
  amplify_storage_s3: ^1.8.0
  image_picker: ^1.2.3
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/launcher_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
