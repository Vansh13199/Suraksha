input AMPLIFY { globalAuthRule: AuthRule = { allow: public } }

type User @model @auth(rules: [{ allow: public }]) {
  id: ID!
  phoneNumber: String! @index(name: "byPhone", sortKeyFields: ["createdAt"])
  firstName: String
  lastName: String
  email: String
  bloodGroup: String
  dateOfBirth: AWSDate
  gender: String
  profilePicUrl: String
  medicalConditions: String
  createdAt: AWSDateTime
  contacts: [EmergencyContact] @hasMany(indexName: "byUser", fields: ["id"])
}

type EmergencyContact @model @auth(rules: [{ allow: public }]) {
  id: ID!
  name: String!
  phoneNumber: String!
  relationship: String
  userId: ID! @index(name: "byUser", sortKeyFields: ["name"])
  user: User @belongsTo(fields: ["userId"])
}

type SOSSession @model @auth(rules: [{ allow: public }]) {
  id: ID!
  phoneNumber: String! @index(name: "byPhone", sortKeyFields: ["updatedAt"])
  isActive: Boolean!
  latitude: Float
  longitude: Float
  updatedAt: AWSDateTime
}
