enum ModelAttributeTypes {
  binary
  binarySet
  bool
  list
  map
  number
  numberSet
  string
  stringSet
  _null
}

input ModelSizeInput {
  ne: Int
  eq: Int
  le: Int
  lt: Int
  ge: Int
  gt: Int
  between: [Int]
}

enum ModelSortDirection {
  ASC
  DESC
}

type ModelUserConnection {
  items: [User]!
  nextToken: String
}

input ModelUserFilterInput {
  id: ModelIDInput
  phoneNumber: ModelStringInput
  firstName: ModelStringInput
  lastName: ModelStringInput
  email: ModelStringInput
  bloodGroup: ModelStringInput
  dateOfBirth: ModelStringInput
  gender: ModelStringInput
  profilePicUrl: ModelStringInput
  medicalConditions: ModelStringInput
  createdAt: ModelStringInput
  updatedAt: ModelStringInput
  and: [ModelUserFilterInput]
  or: [ModelUserFilterInput]
  not: ModelUserFilterInput
}

type Query {
  getUser(id: ID!): User
  listUsers(filter: ModelUserFilterInput, limit: Int, nextToken: String): ModelUserConnection
  getEmergencyContact(id: ID!): EmergencyContact
  listEmergencyContacts(filter: ModelEmergencyContactFilterInput, limit: Int, nextToken: String): ModelEmergencyContactConnection
  getSOSSession(id: ID!): SOSSession
  listSOSSessions(filter: ModelSOSSessionFilterInput, limit: Int, nextToken: String): ModelSOSSessionConnection
  usersByPhoneNumberAndCreatedAt(phoneNumber: String!, createdAt: ModelStringKeyConditionInput, sortDirection: ModelSortDirection, filter: ModelUserFilterInput, limit: Int, nextToken: String): ModelUserConnection
  emergencyContactsByUserIdAndName(userId: ID!, name: ModelStringKeyConditionInput, sortDirection: ModelSortDirection, filter: ModelEmergencyContactFilterInput, limit: Int, nextToken: String): ModelEmergencyContactConnection
  sOSSessionsByPhoneNumberAndUpdatedAt(phoneNumber: String!, updatedAt: ModelStringKeyConditionInput, sortDirection: ModelSortDirection, filter: ModelSOSSessionFilterInput, limit: Int, nextToken: String): ModelSOSSessionConnection
}

input ModelUserConditionInput {
  phoneNumber: ModelStringInput
  firstName: ModelStringInput
  lastName: ModelStringInput
  email: ModelStringInput
  bloodGroup: ModelStringInput
  dateOfBirth: ModelStringInput
  gender: ModelStringInput
  profilePicUrl: ModelStringInput
  medicalConditions: ModelStringInput
  createdAt: ModelStringInput
  and: [ModelUserConditionInput]
  or: [ModelUserConditionInput]
  not: ModelUserConditionInput
  updatedAt: ModelStringInput
}

input CreateUserInput {
  id: ID
  phoneNumber: String!
  firstName: String
  lastName: String
  email: String
  bloodGroup: String
  dateOfBirth: AWSDate
  gender: String
  profilePicUrl: String
  medicalConditions: String
  createdAt: AWSDateTime
}

input UpdateUserInput {
  id: ID!
  phoneNumber: String
  firstName: String
  lastName: String
  email: String
  bloodGroup: String
  dateOfBirth: AWSDate
  gender: String
  profilePicUrl: String
  medicalConditions: String
  createdAt: AWSDateTime
}

input DeleteUserInput {
  id: ID!
}

type Mutation {
  createUser(input: CreateUserInput!, condition: ModelUserConditionInput): User
  updateUser(input: UpdateUserInput!, condition: ModelUserConditionInput): User
  deleteUser(input: DeleteUserInput!, condition: ModelUserConditionInput): User
  createEmergencyContact(input: CreateEmergencyContactInput!, condition: ModelEmergencyContactConditionInput): EmergencyContact
  updateEmergencyContact(input: UpdateEmergencyContactInput!, condition: ModelEmergencyContactConditionInput): EmergencyContact
  deleteEmergencyContact(input: DeleteEmergencyContactInput!, condition: ModelEmergencyContactConditionInput): EmergencyContact
  createSOSSession(input: CreateSOSSessionInput!, condition: ModelSOSSessionConditionInput): SOSSession
  updateSOSSession(input: UpdateSOSSessionInput!, condition: ModelSOSSessionConditionInput): SOSSession
  deleteSOSSession(input: DeleteSOSSessionInput!, condition: ModelSOSSessionConditionInput): SOSSession
}

input ModelSubscriptionUserFilterInput {
  id: ModelSubscriptionIDInput
  phoneNumber: ModelSubscriptionStringInput
  firstName: ModelSubscriptionStringInput
  lastName: ModelSubscriptionStringInput
  email: ModelSubscriptionStringInput
  bloodGroup: ModelSubscriptionStringInput
  dateOfBirth: ModelSubscriptionStringInput
  gender: ModelSubscriptionStringInput
  profilePicUrl: ModelSubscriptionStringInput
  medicalConditions: ModelSubscriptionStringInput
  createdAt: ModelSubscriptionStringInput
  updatedAt: ModelSubscriptionStringInput
  and: [ModelSubscriptionUserFilterInput]
  or: [ModelSubscriptionUserFilterInput]
}

type Subscription {
  onCreateUser(filter: ModelSubscriptionUserFilterInput): User @aws_subscribe(mutations: ["createUser"])
  onUpdateUser(filter: ModelSubscriptionUserFilterInput): User @aws_subscribe(mutations: ["updateUser"])
  onDeleteUser(filter: ModelSubscriptionUserFilterInput): User @aws_subscribe(mutations: ["deleteUser"])
  onCreateEmergencyContact(filter: ModelSubscriptionEmergencyContactFilterInput): EmergencyContact @aws_subscribe(mutations: ["createEmergencyContact"])
  onUpdateEmergencyContact(filter: ModelSubscriptionEmergencyContactFilterInput): EmergencyContact @aws_subscribe(mutations: ["updateEmergencyContact"])
  onDeleteEmergencyContact(filter: ModelSubscriptionEmergencyContactFilterInput): EmergencyContact @aws_subscribe(mutations: ["deleteEmergencyContact"])
  onCreateSOSSession(filter: ModelSubscriptionSOSSessionFilterInput): SOSSession @aws_subscribe(mutations: ["createSOSSession"])
  onUpdateSOSSession(filter: ModelSubscriptionSOSSessionFilterInput): SOSSession @aws_subscribe(mutations: ["updateSOSSession"])
  onDeleteSOSSession(filter: ModelSubscriptionSOSSessionFilterInput): SOSSession @aws_subscribe(mutations: ["deleteSOSSession"])
}

