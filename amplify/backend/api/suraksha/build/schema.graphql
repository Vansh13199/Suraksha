type User {
  id: ID!
  phoneNumber: String!
  firstName: String
  lastName: String
  email: String
  bloodGroup: String
  dateOfBirth: AWSDate
  gender: String
  profilePicUrl: String
  medicalConditions: String
  createdAt: AWSDateTime
  contacts(name: ModelStringKeyConditionInput, filter: ModelEmergencyContactFilterInput, sortDirection: ModelSortDirection, limit: Int, nextToken: String): ModelEmergencyContactConnection
  updatedAt: AWSDateTime!
}

type EmergencyContact {
  id: ID!
  name: String!
  phoneNumber: String!
  relationship: String
  userId: ID!
  user: User
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type SOSSession {
  id: ID!
  phoneNumber: String!
  isActive: Boolean!
  latitude: Float
  longitude: Float
  updatedAt: AWSDateTime
  createdAt: AWSDateTime!
}

